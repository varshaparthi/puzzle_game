<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Game</title>

<style>
    :root {
         --phone-height: 92vh;
          --phone-width: 
          calc(var(--phone-height) * (9 / 16));
         }
    body {
        margin: 0;
        height: 100vh;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        background: #000; 
        font-family: Arial; 
    }
    
    .bg-blur {
         position: fixed; 
         top: 0; left: 0; 
         width: 100%; 
         height: 100%; 
         background: url("home/homeScreen.webp") center/cover no-repeat; 
         filter: blur(20px); 
         z-index: -1; 
        }
    
    .mobile-frame {
        width: var(--phone-width); 
        height: var(--phone-height);
        max-width: 450px; 
        max-height: 800px; 
        border-radius: 25px; 
        overflow: hidden;
        display: flex; 
        flex-direction: column; 
        align-items: center;
        background: url("home/homeScreen.webp") center/cover no-repeat;
        box-shadow: 0 0 40px rgba(0,0,0,0.8); 
        border: 6px solid #222;
        position: relative; /* Essential for positioning icons at bottom */
    }

    /* Center Buttons Area */
    .btn-column {
        display: flex; 
        flex-direction: column; 
        align-items: center;
        gap: 10px; 
        margin-top: 250px;
    }
    .menu-btn {
        background: none; 
        border: none; 
        cursor: pointer; 
        transition: transform 0.2s; 
    }
    .menu-btn:hover { transform: scale(1.05); }
    .menu-btn img {
         width: 100%; 
         max-width: 220px; 
         height: auto; 
        }

    /* Bottom Icons Area */
    .nav {
        position: absolute; bottom: 20px; 
        display: flex; gap: 10px; right: 20px;
    }
    .arrow { background: none; border: none; cursor: pointer; width: 50px; }
    .arrow img { width: 100%; }
    .share-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 10;
    }
    .share-card {
        width: min(420px, 100%);
        background: rgba(4, 66, 138, 0.95);
        border-radius: 20px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        padding: 20px;
        color: #fdfcfc;
        text-align: center;
    }
    .share-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        font-size: 1.1rem;
        font-weight: 700;
    }
    .close-btn {
        border: none;
        background: transparent;
        font-size: 1.6rem;
        cursor: pointer;
        line-height: 1;
    }
    .share-text {
        margin: 0 0 16px;
        color: #fcfafa;
        font-size: 0.96rem;
    }
    .share-buttons {
        display: grid;
        gap: 10px;
    }
    .share-btn {
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .share-btn:hover { transform: scale(1.02); }
    .whatsapp { background: #25d366; color: #fff; }
    .instagram { background: #e1306c; color: #fff; }
    .gmail { background: #d14836; color: #fff; }
    .copy { background: #444; color: #fff; }
    .share-feedback {
        margin-top: 14px;
        color: #222;
        font-size: 0.92rem;
        min-height: 1.3em;
    }
</style>
</head>
<body>

<div class="bg-blur"></div>

<div class="mobile-frame">
    

    <div class="btn-column">
        <button class="menu-btn" onclick="window.location.href='level1.html'"><img src="home/play.webp"></button>
        <button class="menu-btn" onclick="window.location.href='level1.html'"><img src="home/levels.webp"></button>
        <button class="menu-btn"><img src="home/moregames.webp"></button>
    </div>

    <div class="nav">
        <!-- <button class="arrow"><img src="settings.webp"></button> -->
        <button class="arrow" onclick="toggleShareModal()"><img src="home/share.webp"></button>
        <button class="arrow"><img src="home/important.webp"></button>
    </div>
    <div id="share-modal" class="share-modal" aria-hidden="true">
    <div class="share-card">
        <div class="share-header">
            <span>Share this game</span>
            <button class="close-btn" onclick="toggleShareModal()">×</button>
        </div>
        <p class="share-text">Send the game link to your friends via:</p>
        <div class="share-buttons">
            <button class="share-btn whatsapp" onclick="shareToWhatsApp()">WhatsApp</button>
            <button class="share-btn instagram" onclick="shareToInstagram()">Instagram</button>
            <button class="share-btn gmail" onclick="shareToGmail()">Gmail</button>
            <button class="share-btn copy" onclick="copyShareLink()">Copy Link</button>
        </div>
        <p id="share-feedback" class="share-feedback" aria-live="polite"></p>
    </div>
</div>
</div>
<script>
     const shareUrl = window.location.href;
    const shareTitle = encodeURIComponent('Play this puzzle game!');
    const shareBody = encodeURIComponent('Check out this fun puzzle game: ' + shareUrl);

    function toggleShareModal() {
        const modal = document.getElementById('share-modal');
        const hidden = modal.getAttribute('aria-hidden') === 'true';
        modal.setAttribute('aria-hidden', hidden ? 'false' : 'true');
        modal.style.display = hidden ? 'flex' : 'none';
        if (!hidden) {
            document.getElementById('share-feedback').textContent = '';
        }
    }

    function shareToWhatsApp() {
        const url = 'https://wa.me/?text=' + encodeURIComponent('Play this puzzle game: ' + shareUrl);
        window.open(url, '_blank');
    }

    function shareToInstagram() {
        const url = 'https://www.instagram.com/';
        window.open(url, '_blank');
    }

    function shareToGmail() {
        const mailUrl = 'https://mail.google.com/mail/?view=cm&fs=1&su=' + shareTitle + '&body=' + shareBody;
        window.open(mailUrl, '_blank');
    }

    function copyShareLink() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(shareUrl)
                .then(() => {
                    document.getElementById('share-feedback').textContent = 'Link copied to clipboard!';
                })
                .catch(() => {
                    document.getElementById('share-feedback').textContent = 'Unable to copy automatically. Please copy the URL directly: ' + shareUrl;
                });
        } else {
            document.getElementById('share-feedback').textContent = 'Copy the URL manually: ' + shareUrl;
        }
    }
</script>
</body>
    
</html>
